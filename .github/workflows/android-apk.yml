# Genera un .apk firmado de FinanceAI para instalar directamente en Android
# (sin Play Store y sin vencimiento semanal como en iPhone).
#
# Se ejecuta a mano: GitHub → Actions → "Android APK" → Run workflow.
# El .apk queda como artifact descargable al final de la ejecución.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_APP_TOKEN      el mismo que usa el workflow de iOS
#   ANDROID_KEYSTORE_BASE64    contenido de keystore-base64.txt
#   ANDROID_KEYSTORE_PASSWORD  contraseña de LEEME-contrasena.txt
# La llave SIEMPRE debe ser la misma: con otra, Android no deja actualizar
# la app encima y habría que desinstalarla (perdiendo los datos).

name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://camilomartinez-financeai.expo.app' }}
      EXPO_PUBLIC_APP_TOKEN: ${{ secrets.EXPO_PUBLIC_APP_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: financeai

    steps:
      - name: Verificar secretos
        run: |
          if ! echo "$EXPO_PUBLIC_APP_TOKEN" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::EXPO_PUBLIC_APP_TOKEN falta o no tiene el formato correcto (64 caracteres 0-9 a-f)."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan ANDROID_KEYSTORE_BASE64 o ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      # Android exige que cada actualización tenga un versionCode mayor o
      # igual; usar el número de ejecución lo hace subir solo.
      - name: Asignar versionCode
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android.versionCode = 100 + Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
            console.log('versionCode', cfg.expo.android.versionCode);
          "

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restaurar llave de firma
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Las propiedades android.injected.signing.* reemplazan la firma de
      # depuración que trae la plantilla, sin tocar build.gradle.
      - name: Compilar APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"

      - name: Verificar firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" FinanceAI.apk
          ls -lh FinanceAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceAI-apk
          path: FinanceAI.apk
          retention-days: 14
